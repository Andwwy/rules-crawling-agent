[project]
name = "rules-prototype"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # In-process columnar DB + vector similarity (vss extension).
    # Ceiling pin: MotherDuck rejects DuckDB > v1.5.2 at connect time
    # ("Your DuckDB version is not yet supported by MotherDuck"). Raise this
    # only once MotherDuck's supported-version list catches up.
    "duckdb>=1.0,<=1.5.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "click>=8.1",
    "streamlit>=1.40",
    "streamlit-autorefresh>=1.0",
    "pandas>=2.2",
    "altair>=5.4",
    # DuckDB needs pytz to convert TIMESTAMPTZ columns to Python datetime.
    # Pandas 2.2+ no longer requires pytz, so we have to ask for it explicitly.
    "pytz>=2024.1",
]
